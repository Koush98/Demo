<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SnapKey Controller</title>
    <link rel="stylesheet" href="styles.css?v=20260717-camera-voice-video-transition">
  </head>
  <body>
    <main class="control-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Private operator panel</p>
          <h1>SnapKey Controller</h1>
        </div>
        <a class="ghost-link" href="screen.html" target="_blank">Screen</a>
      </header>

      <section class="quick-control-panel">
        <button class="reload-screen-button" type="button" id="reloadScreen">
          <span>Pause / Reload Screen</span>
          <small>Return projector to standby page</small>
        </button>
        <button class="reload-screen-button voice-pause-button" type="button" id="pauseVoice">
          <span>Pause Voice</span>
          <small>Only stop the current voiceover</small>
        </button>
      </section>

      <section class="operator-grid" id="actionList"></section>

      <section class="csr-control-panel">
        <div>
          <p class="eyebrow">CSR slide control</p>
          <h2>Manual image slides</h2>
        </div>
        <div class="csr-control-list" id="csrSlideList"></div>
      </section>

      <section class="csr-control-panel">
        <div>
          <p class="eyebrow">Camera control</p>
          <h2>Manual camera view</h2>
        </div>
        <div class="csr-control-list camera-control-list" id="cameraControlList"></div>
      </section>

      <section class="status-strip">
        <div>
          <span class="label">Sync</span>
          <strong id="syncMode">Local fallback</strong>
        </div>
        <div>
          <span class="label">Last trigger</span>
          <strong id="lastTrigger">None</strong>
        </div>
      </section>

      <aside class="controller-preview">
        <div class="preview-header">
          <div>
            <span class="label">Live screen preview</span>
            <strong id="previewTitle">Idle</strong>
          </div>
          <span class="preview-live"><i></i> Live</span>
        </div>
        <div class="preview-stage" id="previewStage">
          <div class="preview-idle">
            <span></span>
            <p>Waiting for command</p>
          </div>
        </div>
        <p id="previewResponse" class="preview-response">SnapKey is ready.</p>
      </aside>
    </main>

    <script src="config.js?v=20260717-all-standby-slides"></script>
    <script src="script-data.js?v=20260717-slide-video-controls"></script>
    <script src="sync.js?v=20260717-camera-voice-video-transition"></script>
    <script src="control.js?v=20260717-video-switch-poster-fix"></script>
  </body>
</html>
