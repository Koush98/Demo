<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SnapKey Controller</title>
    <link rel="stylesheet" href="styles.css?v=20260716-slower-csr-slides">
  </head>
  <body>
    <main class="control-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Private operator panel</p>
          <h1>SnapKey Controller</h1>
        </div>
        <a class="ghost-link" href="screen.html" target="_blank">Screen</a>
      </header>

      <section class="operator-grid" id="actionList"></section>

      <section class="csr-control-panel">
        <div>
          <p class="eyebrow">CSR slide control</p>
          <h2>Manual image slides</h2>
        </div>
        <div class="csr-control-list" id="csrSlideList"></div>
      </section>

      <section class="status-strip">
        <div>
          <span class="label">Sync</span>
          <strong id="syncMode">Local fallback</strong>
        </div>
        <div>
          <span class="label">Last trigger</span>
          <strong id="lastTrigger">None</strong>
        </div>
      </section>

      <aside class="controller-preview">
        <div class="preview-header">
          <div>
            <span class="label">Live screen preview</span>
            <strong id="previewTitle">Idle</strong>
          </div>
          <span class="preview-live"><i></i> Live</span>
        </div>
        <div class="preview-stage" id="previewStage">
          <div class="preview-idle">
            <span></span>
            <p>Waiting for command</p>
          </div>
        </div>
        <p id="previewResponse" class="preview-response">SnapKey is ready.</p>
      </aside>
    </main>

    <script src="config.js?v=20260716-csr-images"></script>
    <script src="script-data.js?v=20260716-voice-live-web"></script>
    <script src="sync.js"></script>
    <script src="control.js?v=20260716-manual-csr-slides"></script>
  </body>
</html>
